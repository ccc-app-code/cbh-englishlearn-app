<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英语听写练习</title>
    <style>
        :root {
            --bg-start: #E0F7FA;
            --bg-end: #E0F2F1;
            --card: #fff;
            --text: #333;
            --text-secondary: #555;
            --text-muted: #777;
            --accent: #0097A7;
            --accent2: #00ACC1;
            --green: #00897B;
            --green-light: #26A69A;
            --green-dark: #00695C;
            --teal: #009688;
            --teal-light: #4DB6AC;
            --cyan: #00BCD4;
            --red: #c62828;
            --orange: #FF9800;
            --shadow: 0 2px 8px rgba(0,105,92,0.08);
            --shadow-lg: 0 4px 16px rgba(0,105,92,0.10);
            --radius-sm: 10px;
            --radius-xs: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #FFF5F5 0%, #FFF8E1 20%, #F1F8E9 40%, #E3F2FD 60%, #EDE7F6 80%, #FCE4EC 100%);
            color: var(--text); -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none; padding: 0; max-width: 700px; margin: 0 auto;
            min-height: 100vh;
        }

        /* ===== 顶部导航标签 ===== */
        .nav-tabs {
            display: flex; position: sticky; top: 0; z-index: 100;
            background: linear-gradient(90deg, #E53935, #FB8C00, #FDD835, #43A047, #1E88E5, #5C6BC0, #8E24AA);
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .nav-tab {
            flex: 1; padding: 14px 8px; text-align: center; cursor: pointer;
            font-weight: 700; font-size: 0.95em; color: rgba(255,255,255,0.7);
            border-bottom: 3px solid transparent; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-tab.active { color: #fff; border-bottom-color: #fff; background: rgba(255,255,255,0.1); }
        .nav-tab:active { background: rgba(255,255,255,0.18); }

        .page { display: none; padding: 16px 18px 30px; }
        .page.active { display: block; }

        /* ===== 听写页标题 ===== */
        .page-title {
            text-align: center; margin-bottom: 2px; font-size: 1.4em; font-weight: 800;
            background: linear-gradient(90deg, #E53935, #FB8C00, #FDD835, #43A047, #1E88E5, #5C6BC0, #8E24AA);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 0.85em; margin-bottom: 14px; }

        /* ===== 卡片 ===== */
        .speed-card {
            display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
            background: var(--card); padding: 10px 14px; border-radius: var(--radius-sm);
            box-shadow: var(--shadow); border-left: 3px solid #E53935;
        }
        .speed-card label { font-weight: 600; font-size: 0.85em; color: var(--text-secondary); }
        .speed-slider { display: flex; align-items: center; gap: 6px; flex: 1; }
        .speed-slider input[type="range"] { flex: 1; height: 5px; -webkit-appearance: none; background: #B2DFDB; border-radius: 3px; }
        .speed-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: linear-gradient(135deg, #E53935, #FB8C00); cursor: pointer;
            border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .speed-value { font-size: 0.8em; font-weight: 700; color: #E53935; min-width: 36px; text-align: center; }

        .btn-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        button {
            padding: 12px 18px; font-size: 15px; border-radius: var(--radius-sm); border: none; cursor: pointer;
            font-weight: 600; transition: all 0.15s; background: #e0e0e0; color: #333;
            -webkit-appearance: none; touch-action: manipulation;
        }
        button:active { transform: scale(0.95); opacity: 0.8; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }

        /* 播放/检查/下一句 按钮：彩虹色系 */
        .btn-play, .btn-check, .btn-next {
            font-size: 1.05em; padding: 14px 22px; min-width: 100px; height: 52px; line-height: 1.2;
            color: #fff;
        }
        .btn-play { background: linear-gradient(135deg, #E53935, #FB8C00); }
        .btn-pause { background: linear-gradient(135deg, #EF5350, #FFB74D); font-size: 1.05em; padding: 14px 22px; min-width: 100px; height: 52px; color: #fff; }
        .btn-check { background: linear-gradient(135deg, #43A047, #1E88E5); }
        .btn-next { background: linear-gradient(135deg, #1E88E5, #5C6BC0); }
        .btn-add { background: linear-gradient(135deg, #8E24AA, #E53935); color: #fff; width: 100%; margin-top: 6px; }

        /* 录音按钮 */
        .record-row { display: flex; gap: 8px; margin-top: 16px; margin-bottom: 8px; }
        .btn-record { background: linear-gradient(135deg, #FB8C00, #FDD835); color: #fff; flex: 1; padding: 14px 10px; font-size: 1em; }
        .btn-play-recording { background: linear-gradient(135deg, #5C6BC0, #8E24AA); color: #fff; flex: 1; padding: 14px 10px; font-size: 1em; }
        .btn-record.recording { background: var(--red); animation: pulse 1.5s infinite; }
        .btn-history { background: linear-gradient(135deg, #8E24AA, #E53935); color: #fff; width: 100%; margin-top: 12px; font-size: 0.95em; padding: 14px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .progress-container {
            display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
            background: var(--card); padding: 8px 14px; border-radius: var(--radius-sm);
            box-shadow: var(--shadow); border-left: 3px solid #FB8C00;
        }
        .progress-container input[type="range"] { flex: 1; height: 6px; -webkit-appearance: none; background: #B2DFDB; border-radius: 3px; }
        .progress-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: linear-gradient(135deg, #FB8C00, #FDD835); cursor: pointer;
            border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .progress-time { font-size: 0.8em; color: var(--text-secondary); min-width: 42px; text-align: center; font-family: monospace; }

        #userInput {
            width: 100%; height: 30vh; min-height: 150px; max-height: 50vh; padding: 14px 16px;
            font-size: 16px; border-radius: var(--radius-sm); border: 2px solid #B2DFDB; background: #fff;
            resize: none; font-family: inherit; line-height: 1.7; overflow-y: auto;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #userInput:focus { outline: none; border-color: #5C6BC0; box-shadow: 0 0 0 4px rgba(92,107,192,0.12); }
        #userInput::placeholder { color: #bbb; }

        .result {
            padding: 16px; background: #fff; border-radius: var(--radius-sm); white-space: pre-wrap;
            line-height: 1.9; font-size: 0.95em; box-shadow: var(--shadow); min-height: 20px; margin-bottom: 8px;
        }
        .correct { color: #2E7D32; font-weight: bold; background: #C8E6C9; padding: 2px 7px; border-radius: 4px; margin: 0 2px; }
        .wrong { color: #c62828; text-decoration: underline; font-weight: bold; background: #ffebee; padding: 2px 7px; border-radius: 4px; margin: 0 2px; }
        .result-empty { color: #bbb; text-align: center; display: block; }

        .add-section {
            background: #fff; border-radius: var(--radius-sm); padding: 16px;
            box-shadow: var(--shadow); margin-top: 8px; border-left: 3px solid #8E24AA;
        }
        .add-section .list-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 10px; color: #8E24AA; }
        .add-section input[type="text"] {
            width: 100%; padding: 12px 14px; font-size: 15px; border-radius: var(--radius-xs);
            border: 2px solid #B2DFDB; background: #fff; margin-bottom: 4px;
        }
        .add-section input[type="text"]:focus { outline: none; border-color: #8E24AA; box-shadow: 0 0 0 3px rgba(142,36,170,0.10); }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #5C6BC0, #8E24AA); color: #fff;
            padding: 10px 22px; border-radius: 24px; font-size: 0.9em; z-index: 999; opacity: 0;
            pointer-events: none; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; pointer-events: auto; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: var(--radius-sm); padding: 20px; max-width: 600px; width: 90%;
            max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-content h3 { margin-bottom: 12px; font-size: 1.2em; }
        .modal-content ul { list-style: none; margin-bottom: 16px; }
        .modal-content li { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; flex-direction: column; font-size: 0.9em; }
        .modal-content li .delete-btn {
            background: var(--red); color: #fff; padding: 4px 12px; border-radius: 15px; font-size: 0.8em;
            border: none; cursor: pointer; align-self: flex-start; margin-top: 4px;
        }
        .modal-content .close-btn { background: #eee; color: #333; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 0.9em; border: none; cursor: pointer; }

        /* ===== 撒花庆祝 ===== */
        #confettiCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; pointer-events: none; display: none;
        }

        /* ===== 日历页 ===== */
        #page-calendar { padding-top: 20px; }
        .cal-hero {
            text-align: center; margin-bottom: 16px;
        }
        .cal-hero .cal-title {
            font-size: 1.5em; font-weight: 800;
            background: linear-gradient(135deg, #00695C, #0097A7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .cal-stats-row {
            display: flex; gap: 10px; margin-bottom: 16px;
        }
        .cal-stat-card {
            flex: 1; background: #fff; border-radius: var(--radius-sm); padding: 14px 12px;
            text-align: center; box-shadow: var(--shadow);
        }
        .cal-stat-card .stat-num {
            font-size: 1.8em; font-weight: 800;
            background: linear-gradient(135deg, #00695C, #0097A7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .cal-stat-card .stat-label { font-size: 0.72em; color: var(--text-muted); margin-top: 2px; }
        .calendar-card {
            background: var(--card); border-radius: var(--radius-sm); padding: 18px 16px;
            box-shadow: var(--shadow-lg);
        }
        .calendar-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
        }
        .calendar-header .month-label { font-weight: 700; font-size: 1em; color: var(--green-dark); }
        .calendar-header .month-nav { display: flex; gap: 6px; }
        .calendar-header .month-nav button {
            width: 34px; height: 34px; padding: 0; font-size: 18px; border-radius: 50%;
            background: linear-gradient(135deg, #00897B, #009688); color: #fff;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .calendar-header .month-nav button:disabled { opacity: 0.3; }
        .calendar-summary { font-size: 0.8em; color: var(--text-muted); text-align: center; margin-bottom: 10px; }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;
        }
        .cal-day-label {
            font-size: 0.72em; font-weight: 600; color: var(--text-muted); padding: 4px 0;
        }
        .cal-day {
            aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 0.85em; font-weight: 600; cursor: default; position: relative;
            min-width: 30px; min-height: 30px;
        }
        .cal-day.empty { background: transparent; }
        .cal-day.level-0 { background: #ECEFF1; color: #999; }
        .cal-day.level-1 { background: #B2DFDB; color: #00695C; }
        .cal-day.level-2 { background: #4DB6AC; color: #fff; }
        .cal-day.level-3 { background: #009688; color: #fff; }
        .cal-day.level-4 { background: #00796B; color: #fff; }
        .cal-day.today { box-shadow: 0 0 0 2px var(--green-dark); }
        .cal-day.has-data:hover { opacity: 0.8; transform: scale(1.15); transition: 0.15s; }

        .legend-row {
            display: flex; align-items: center; gap: 6px; justify-content: center;
            margin-top: 10px; font-size: 0.75em; color: var(--text-muted);
        }
        .legend-swatch { width: 16px; height: 16px; border-radius: 4px; }

        @media (max-width: 480px) {
            .page { padding: 12px 12px 30px; }
            .page-title { font-size: 1.2em; }
            button { padding: 10px 14px; font-size: 14px; }
            .btn-play,.btn-pause,.btn-check,.btn-next { padding: 12px 16px; font-size: 0.9em; min-width: 72px; height: 44px; }
            .btn-record,.btn-play-recording { padding: 12px 10px; font-size: 0.9em; }
            #userInput { height: 30vh; min-height: 120px; font-size: 15px; }
            .progress-container { padding: 6px 10px; gap: 4px; }
            .progress-time { font-size: 0.72em; min-width: 34px; }
            .speed-card { padding: 8px 10px; gap: 5px; }
            .speed-card label { font-size: 0.75em; }
            .calendar-grid { gap: 2px; }
            .cal-day { min-width: 24px; min-height: 24px; font-size: 0.72em; }
            .cal-day-label { font-size: 0.65em; }
            .cal-stat-card .stat-num { font-size: 1.4em; }
            .nav-tab { padding: 12px 4px; font-size: 0.85em; }
        }
    </style>
</head>
<body>
    <!-- 撒花画布 -->
    <canvas id="confettiCanvas"></canvas>

    <!-- 顶部导航 -->
    <nav class="nav-tabs">
        <div class="nav-tab active" id="tabDictation" onclick="switchPage('dictation')">🎧 听写练习</div>
        <div class="nav-tab" id="tabCalendar" onclick="switchPage('calendar')">📅 学习日历</div>
    </nav>

    <!-- ========== 听写练习页 ========== -->
    <div class="page active" id="page-dictation">
    <h2 class="page-title">🎧 小毛快练</h2>
    <p class="subtitle"></p>

    <div class="speed-card">
        <label>🐢 语速</label>
        <div class="speed-slider"><input type="range" id="speedSlider" min="0.6" max="1.2" step="0.05" value="0.85"></div>
        <span class="speed-value" id="speedValue">0.85x</span>
    </div>

    <div class="progress-container">
        <span class="progress-time" id="currentTimeDisplay">00:00</span>
        <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" disabled>
        <span class="progress-time" id="totalTimeDisplay">00:00</span>
    </div>

    <div class="writing-area">
        <textarea id="userInput" placeholder="在这里默写…（Enter 检查，Shift+Enter 换行）" autocomplete="off"></textarea>
    </div>

    <div class="btn-row">
        <button type="button" class="btn-play" id="playPauseBtn">▶ 播放</button>
        <button type="button" class="btn-check" id="checkBtn" onclick="checkAndShowAnswer()">✅ 检查</button>
        <button type="button" class="btn-next" onclick="nextSentence()">🎲 下一句</button>
    </div>

    <div class="result" id="resultArea"></div>

    <div class="record-row">
        <button type="button" class="btn-record" id="recordBtn" onclick="toggleRecording()">🎤 录音</button>
        <button type="button" class="btn-play-recording" id="playRecordingBtn" onclick="playRecording()" disabled>🔊 播放录音</button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="add-section">
        <div class="list-title">➕ 添加新句子到句库</div>
        <input type="text" id="newSentenceInput" placeholder="输入英语句子，按 Enter 添加">
        <button type="button" class="btn-add" onclick="addNewSentence()">添加句子</button>
    </div>

    <button type="button" class="btn-history" onclick="showHistory()">📜 历史记录</button>

    <div class="modal-overlay" id="historyModal">
        <div class="modal-content">
            <h3>📜 历史记录（最新提交）</h3>
            <ul id="historyList"></ul>
            <button class="close-btn" onclick="closeHistory()">关闭</button>
        </div>
    </div>
    </div><!-- /page-dictation -->

    <!-- ========== 学习日历页 ========== -->
    <div class="page" id="page-calendar">
        <div class="cal-hero">
            <div class="cal-title">📅 学习日历</div>
        </div>

        <div class="cal-stats-row">
            <div class="cal-stat-card">
                <div class="stat-num" id="statTotal">0</div>
                <div class="stat-label">📝 累计练习句数</div>
            </div>
            <div class="cal-stat-card">
                <div class="stat-num" id="statDays">0</div>
                <div class="stat-label">🔥 累计学习天数</div>
            </div>
            <div class="cal-stat-card">
                <div class="stat-num" id="statMonth">0</div>
                <div class="stat-label">📅 本月句数</div>
            </div>
        </div>

        <div class="calendar-card">
            <div class="calendar-header">
                <button class="month-nav" onclick="changeMonth(-1)" title="上个月">◀</button>
                <span class="month-label" id="monthLabel">2025年1月</span>
                <button class="month-nav" onclick="changeMonth(1)" title="下个月">▶</button>
            </div>
            <div class="calendar-summary" id="calendarSummary"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="legend-row">
                <span>少</span>
                <span class="legend-swatch" style="background:#ECEFF1;"></span>
                <span class="legend-swatch" style="background:#B2DFDB;"></span>
                <span class="legend-swatch" style="background:#4DB6AC;"></span>
                <span class="legend-swatch" style="background:#009688;"></span>
                <span class="legend-swatch" style="background:#00796B;"></span>
                <span>多</span>
            </div>
        </div>
    </div><!-- /page-calendar -->

    <script>
        // ==================== 存储 ====================
        const STORAGE_KEY_SENTENCES = 'sentencePool_v7';
        const STORAGE_KEY_SPEED = 'playbackSpeed_v4';
        const STORAGE_KEY_HISTORY = 'sentenceHistory_v3';
        const STORAGE_KEY_TRANSLATE = 'translateCache_v1';
        const STORAGE_KEY_CALENDAR = 'dailyStats_v1';
        const STORAGE_KEY_COMPLETION = 'completionCount_v1';

        // ==================== 商务英语 100 句 ====================
        const businessEnglishSentences = [
            "In order to effectively negotiate a comprehensive international trade agreement that satisfies all stakeholders involved, we must first conduct a thorough analysis of the current market conditions, regulatory frameworks, and potential risks that could significantly impact the long-term viability of this partnership across multiple jurisdictions and economic cycles",

            "As part of our ongoing commitment to corporate social responsibility and ethical business practices, we will be publishing our first annual sustainability report next quarter, which will provide detailed information about our environmental impact, community engagement initiatives, diversity and inclusion metrics, and governance structures",
            "Given the increasing importance of data-driven decision making in today's competitive business environment, I strongly believe that we should allocate additional resources toward building our business intelligence capabilities, including hiring experienced data scientists, investing in advanced analytics platforms, and establishing a company-wide data governance framework",

            try {

                const resp = await fetch(url);
                const data = await resp.json();
                const translated = (data.responseData && data.responseData.translatedText) || '';
                if (translated) {

                    saveTranslateCache(translateCache);
                }
                return translated;
            } catch (e) { return ''; }
        }

        function triggerCelebration(count) {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.display = 'block';

            const colors = ['#E53935','#FB8C00','#FDD835','#43A047','#1E88E5','#5C6BC0','#8E24AA','#FF4081','#00BCD4','#FF9800','#4CAF50','#FF5722'];
            const particles = [];
            const total = 120;

            for (let i = 0; i < total; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.3 - canvas.height * 0.4,
                    w: Math.random() * 10 + 6,
                    h: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 5,
                    vy: Math.random() * 3 + 2,
                    rot: Math.random() * 360,
                    rotV: (Math.random() - 0.5) * 12,
                    opacity: 1
                });
            }

            // 中央提示文字
            function drawText() {
                ctx.save();
                ctx.font = 'bold 28px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillStyle = '#333';
                ctx.textAlign = 'center';
                ctx.globalAlpha = Math.min(1, (Date.now() - startTime) / 500);
                ctx.fillText(`🎉 太棒了！已完成 ${count} 句！`, canvas.width / 2, canvas.height * 0.4);
                ctx.restore();
            }

            const startTime = Date.now();
            const duration = 3500;

            function animate() {
                if (Date.now() - startTime > duration) {
                    canvas.style.display = 'none';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const progress = (Date.now() - startTime) / duration;
                for (const p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.08; // gravity
                    p.rot += p.rotV;
                    p.opacity = 1 - progress;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.globalAlpha = p.opacity;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                }
                drawText();
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);

            // Toast 提示
            showToast(`🎉 完成了 ${count} 句！继续加油！`, 2500);
        }

        function getTotalStats() {

            for (const key in dailyStats) {

                    totalSentences += dailyStats[key];

        function getMonthStats(year, month) {
            let total = 0, days = 0;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const c = dailyStats[ds] || 0;
                if (c > 0) { total += c; days++; }
            }
            return { total, days };
        }

        let calYear, calMonth;
        function renderCalendar(year, month) {
            calYear = year; calMonth = month;
            const grid = document.getElementById('calendarGrid');
            const label = document.getElementById('monthLabel');
            const summary = document.getElementById('calendarSummary');

            label.textContent = `${year}年${month + 1}月`;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDow = new Date(year, month, 1).getDay();

            let monthTotal = 0, monthDays = 0;
            const todayStr = todayKey();

            const dowLabels = ['日', '一', '二', '三', '四', '五', '六'];
            let html = dowLabels.map(d => `<div class="cal-day-label">${d}</div>`).join('');

            for (let i = 0; i < firstDow; i++) {
                html += '<div class="cal-day empty"></div>';
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const count = dailyStats[dateStr] || 0;
                if (count > 0) { monthTotal += count; monthDays++; }

                let levelClass = 'level-0';
                if (count >= 6) levelClass = 'level-4';
                else if (count >= 4) levelClass = 'level-3';
                else if (count >= 2) levelClass = 'level-2';
                else if (count >= 1) levelClass = 'level-1';

                const isToday = dateStr === todayStr;
                const todayClass = isToday ? ' today' : '';
                const hasDataClass = count > 0 ? ' has-data' : '';
                const title = count > 0 ? ` title="${count} 句"` : '';

                html += `<div class="cal-day ${levelClass}${todayClass}${hasDataClass}"${title}>${d}</div>`;
            }

            grid.innerHTML = html;
            summary.textContent = monthTotal > 0
                ? `本月共 ${monthDays} 天有练习，累计 ${monthTotal} 句 ✓`
                : '本月暂无练习记录';

            // 更新统计卡片
            const allStats = getTotalStats();
            const elTotal = document.getElementById('statTotal');
            const elDays = document.getElementById('statDays');
            const elMonth = document.getElementById('statMonth');
            if (elTotal) elTotal.textContent = allStats.totalSentences;
            if (elDays) elDays.textContent = allStats.totalDays;
            if (elMonth) elMonth.textContent = monthTotal;
        }

        function changeMonth(delta) {
            let m = calMonth + delta;
            let y = calYear;
            if (m < 0) { m = 11; y--; }
            if (m > 11) { m = 0; y++; }
            const now = new Date();
            if (y > now.getFullYear() || (y === now.getFullYear() && m > now.getMonth())) return;
            renderCalendar(y, m);
        }

        let mediaRecorder = null;

        const recordBtn = document.getElementById('recordBtn');

        function getSupportedMimeType() {
            const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
            for (let type of types) { if (MediaRecorder.isTypeSupported(type)) return type; }
            return '';
        }

        async function startRecording() {
            audioChunks = [];
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('❌ 当前浏览器不支持录音功能', 2500); return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = getSupportedMimeType();
                const options = mimeType ? { mimeType } : {};
                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
                    if (recordingUrl) URL.revokeObjectURL(recordingUrl);
                    recordingUrl = URL.createObjectURL(recordedBlob);
                    playRecordingBtn.disabled = false;
                    stream.getTracks().forEach(track => track.stop());
                    showToast('✅ 录音完成', 1500);
                };
                mediaRecorder.onerror = () => { showToast('❌ 录音出错', 2000); stopRecordingUI(); };
                mediaRecorder.start();
                recordBtn.textContent = '⏹ 停止录音';
                recordBtn.classList.add('recording');
                showToast('🎤 录音中…', 1500);
            } catch (err) {
                console.error(err);
                showToast('❌ 无法访问麦克风，请检查权限设置', 2500);
            }
        }

        function stopRecordingUI() {
            if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); }
            recordBtn.textContent = '🎤 录音';
            recordBtn.classList.remove('recording');
        }

        function toggleRecording() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') { startRecording(); }
            else if (mediaRecorder.state === 'recording') { stopRecordingUI(); }
        }

        function playRecording() {
            if (!recordingUrl) { showToast('⚠️ 请先录音', 2000); return; }
            audioPlayer.src = recordingUrl;
            audioPlayer.load();

        }

        }

        function stopPlayback(keepPaused = false) {
            detachUtterance();
            window.speechSynthesis.cancel();
            if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
            sentenceQueue = [];
            sentenceQueueIdx = 0;
            isPlaying = false;
            if (!keepPaused) isPaused = false;
        }

        function resetAll() {
            stopPlayback(false);
            pausedCharPos = 0;
            progressBar.value = 0; progressBar.disabled = true;
            currentTimeDisplay.textContent = '00:00';
            totalTimeDisplay.textContent = '00:00';
            updatePlayPauseButton();
        }

        function refocusInput() {
            if (document.activeElement !== userInputEl) {
                const start = userInputEl.selectionStart;
                const end = userInputEl.selectionEnd;
                userInputEl.focus();
                setTimeout(() => { userInputEl.setSelectionRange(start, end); }, 10);
            }
        }

        function splitSentences(text, offset) {
            const result = [];
            const regex = /[^.!?]+[.!?]+\s*/g;
            let match;
            while ((match = regex.exec(text)) !== null) {
                result.push({ text: match[0], charStart: offset + match.index });
            }
            // 处理末尾不含句号/问号/感叹号的剩余文本
            const lastEnd = result.length > 0
                ? result[result.length - 1].charStart + result[result.length - 1].text.length - offset
                : 0;
            const remaining = text.substring(lastEnd).trim();
            if (remaining) {
                result.push({ text: remaining, charStart: offset + lastEnd + text.substring(lastEnd).indexOf(remaining) });
            }
            return result;
        }

        function speakNextSentence() {
            if (!isPlaying || sentenceQueueIdx >= sentenceQueue.length) {
                isPlaying = false;
                if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
                progressBar.value = 100;
                currentTimeDisplay.textContent = totalTimeDisplay.textContent;
                updatePlayPauseButton();
                return;
            }

            const { text, charStart } = sentenceQueue[sentenceQueueIdx];

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = playbackSpeed;
            utterance.lang = 'en-US';

            utterance.onstart = () => {
                if (!isPlaying) return;
                pausedCharPos = charStart;
                startTime = Date.now();
                if (progressTimer) clearInterval(progressTimer);
                progressTimer = setInterval(updateProgress, 100);
                refocusInput();
            };
            utterance.onend = () => {
                if (!isPlaying) return;
                sentenceQueueIdx++;
                speakNextSentence();
            };
            utterance.onerror = () => {
                if (!isPlaying) return;
                sentenceQueueIdx++;
                speakNextSentence();
            };

            currentUtterance = utterance;
            window.speechSynthesis.speak(utterance);
        }

        function startPlayback(fromChar) {
            stopPlayback(false);
            if (currentIndex === null || !sentencePool[currentIndex]) return;

            fullText = sentencePool[currentIndex];
            totalChars = fullText.length;
            const rate = Math.max(0.5, playbackSpeed) * 14;
            estimatedDuration = Math.max(1, totalChars / rate);
            progressBar.disabled = false;
            progressBar.max = 100;
            totalTimeDisplay.textContent = formatTime(estimatedDuration);

            const startPos = findWordBoundary(fullText, fromChar);
            pausedCharPos = startPos;

            progressBar.value = (startPos / totalChars) * 100;
            currentTimeDisplay.textContent = formatTime((startPos / totalChars) * estimatedDuration);

            // 将剩余文本拆成句子队列，逐个朗读以保证断句
            const remainingText = fullText.substring(startPos);
            sentenceQueue = splitSentences(remainingText, startPos);
            sentenceQueueIdx = 0;

            isPlaying = true;
            updatePlayPauseButton();

            window.speechSynthesis.cancel();
            speakNextSentence();
        }

        function updateProgress() {
            if (!isPlaying || totalChars <= 0 || isDragging) return;
            const elapsed = (Date.now() - startTime) / 1000;
            const rate = Math.max(0.5, playbackSpeed) * 14;
            const chars = Math.floor(elapsed * rate);
            const curChar = Math.min(totalChars, pausedCharPos + chars);
            progressBar.value = (curChar / totalChars) * 100;
            currentTimeDisplay.textContent = formatTime((curChar / totalChars) * estimatedDuration);

        }

        function handlePlayPause() {
            if (currentIndex === null || !sentencePool.length) { showToast('没有句子', 2000); return; }
            if (!isPlaying && !isPaused) { startPlayback(0); }
            else if (isPlaying) {
                const elapsed = (Date.now() - startTime) / 1000;
                const rate = Math.max(0.5, playbackSpeed) * 14;
                pausedCharPos = Math.min(totalChars, pausedCharPos + Math.floor(elapsed * rate));
                detachUtterance();
                window.speechSynthesis.cancel();
                if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
                isPlaying = false; isPaused = true;
                updatePlayPauseButton();
                refocusInput();
            } else if (isPaused) { startPlayback(pausedCharPos); }
        }

        function updatePlayPauseButton() {
            const disabled = (currentIndex === null || !sentencePool.length);
            playPauseBtn.disabled = disabled;
            if (disabled) { playPauseBtn.textContent = '▶ 播放'; playPauseBtn.className = 'btn-play'; return; }
            if (!isPlaying && !isPaused) { playPauseBtn.textContent = '▶ 播放'; playPauseBtn.className = 'btn-play'; }
            else if (isPlaying) { playPauseBtn.textContent = '⏸ 暂停'; playPauseBtn.className = 'btn-pause'; }
            else if (isPaused) { playPauseBtn.textContent = '▶ 继续'; playPauseBtn.className = 'btn-play'; }
        }

        playPauseBtn.addEventListener('click', (e) => { e.preventDefault(); handlePlayPause(); });
        playPauseBtn.addEventListener('touchend', (e) => { e.preventDefault(); handlePlayPause(); });

        progressBar.addEventListener('mousedown', () => { isDragging = true; });
        progressBar.addEventListener('touchstart', () => { isDragging = true; });
        progressBar.addEventListener('mouseup', () => { isDragging = false; });
        progressBar.addEventListener('touchend', () => { isDragging = false; });
        progressBar.addEventListener('mouseleave', () => { if (isDragging) isDragging = false; });
        progressBar.addEventListener('input', (e) => {
            if (totalChars <= 0) return;
            const p = parseFloat(e.target.value);
            const tc = Math.floor((p / 100) * totalChars);
            currentTimeDisplay.textContent = formatTime((tc / totalChars) * estimatedDuration);
            if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
        });
        progressBar.addEventListener('change', (e) => {
            if (totalChars <= 0) return;
            const p = parseFloat(e.target.value);
            const tc = Math.floor((p / 100) * totalChars);
            startPlayback(tc);
        });

        speedSlider.addEventListener('input', () => {
            playbackSpeed = parseFloat(speedSlider.value);
            speedValueEl.textContent = playbackSpeed.toFixed(2) + 'x';
            if (totalChars > 0) {
                const rate = Math.max(0.5, playbackSpeed) * 14;
                estimatedDuration = Math.max(1, totalChars / rate);
                totalTimeDisplay.textContent = formatTime(estimatedDuration);
            }
        });
        speedSlider.addEventListener('change', () => { localStorage.setItem(STORAGE_KEY_SPEED, playbackSpeed); });

        function switchToSentence(idx) {
            if (idx < 0 || idx >= sentencePool.length) return;
            if (currentIndex === idx) return;
            resetAll();
            currentIndex = idx;
            clearInputAndResult();
            resetTextareaHeight();
            totalChars = sentencePool[currentIndex].length;
            const rate = Math.max(0.5, playbackSpeed) * 14;
            estimatedDuration = Math.max(1, totalChars / rate);
            progressBar.value = 0; progressBar.disabled = true;
            currentTimeDisplay.textContent = '00:00';
            totalTimeDisplay.textContent = formatTime(estimatedDuration);
            updatePlayPauseButton();
        }

        function nextSentence() {
            if (sentencePool.length === 0) { showToast('📭 句子库为空', 2500); return; }
            if (sentencePool.length === 1) { showToast('📌 只有1句，请添加更多。', 2500); return; }
            const availableIndices = sentencePool.map((_, i) => i).filter(i => i !== currentIndex);
            const ni = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            switchToSentence(ni);
        }

        function clearInputAndResult() { userInputEl.value = ''; resultArea.innerHTML = ''; }

        function normalizeWord(word) {
            const cleaned = word.replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g, '').toLowerCase();
            return cleaned || '';
        }

        function escapeHtml(s) { const div = document.createElement('div'); div.textContent = s; return div.innerHTML; }

        async function checkAnswer() {
            if (currentIndex === null) return;
            const rawUser = userInputEl.value.trim();
            const correct = sentencePool[currentIndex].trim();
            if (!rawUser) { resultArea.innerHTML = '<span class="result-empty">⚠️ 请先输入答案。</span>'; return; }
            const userWords = rawUser.split(/\s+/);
            const correctWords = correct.split(/\s+/);
            const normUser = userWords.map(normalizeWord);
            const normCorrect = correctWords.map(normalizeWord);
            let html = '';
            let cIdx = 0, uIdx = 0;
            while (cIdx < normCorrect.length && uIdx < normUser.length) {
                const userClean = normUser[uIdx];
                const correctClean = normCorrect[cIdx];
                if (userClean === correctClean) {
                    html += `<span class="correct">${escapeHtml(userWords[uIdx])}</span> `;
                    cIdx++; uIdx++;
                } else {
                    let foundFuture = false;
                    for (let k = cIdx + 1; k < normCorrect.length; k++) {
                        if (userClean === normCorrect[k]) { foundFuture = true; break; }
                    }
                    if (foundFuture) { cIdx++; }
                    else { html += `<span class="wrong">${escapeHtml(userWords[uIdx])}</span> `; uIdx++; }
                }
            }
            while (uIdx < normUser.length) { html += `<span class="wrong">${escapeHtml(userWords[uIdx])}</span> `; uIdx++; }
            const perfect = normUser.join(' ') === normCorrect.join(' ');

            // 显示翻译结果
            resultArea.innerHTML = `📝 <strong>你的答案：</strong><br>${html.trim()}<br><br>` +
                (perfect ? '🎉 <strong>完全正确！</strong>' : '💡 还有差距，仔细听原音再试试。') +
                `<br>✅ <strong>正确答案：</strong>${escapeHtml(correct)}` +
                `<br><span id="translationLine" style="color:#888;">🌐 翻译中...</span>`;

            // 异步获取翻译
            const zh = await translateText(correct);
            const tlEl = document.getElementById('translationLine');
            if (tlEl) {
                tlEl.textContent = zh ? `🌐 ${zh}` : '';
                if (!zh) tlEl.style.display = 'none';
            }
            updateHistory(correct, rawUser);
            userInputEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            userInputEl.focus();
        }

        function checkAndShowAnswer() { checkAnswer(); }

        function addNewSentence() {
            const inp = document.getElementById('newSentenceInput');
            const t = inp.value.trim();
            if (!t) { showToast('请输入有效的英语句子', 2000); return; }
            if (!sentencePool.includes(t)) { sentencePool.push(t); saveSentencePool(sentencePool); }
            inp.value = '';
            if (currentIndex === null && sentencePool.length === 1) {
                currentIndex = 0; clearInputAndResult(); resetTextareaHeight();
                totalChars = t.length; estimatedDuration = Math.max(1, totalChars / (Math.max(0.5, playbackSpeed) * 14));
                totalTimeDisplay.textContent = formatTime(estimatedDuration); updatePlayPauseButton();
            }
            showToast('✅ 句子已添加！', 1800);
        }

        function showHistory() {
            const history = loadHistory();
            const entries = Object.entries(history);
            if (entries.length === 0) {
                historyList.innerHTML = '<li style="text-align:center;color:#999;">暂无提交记录</li>';
            } else {
                entries.sort((a, b) => b[1].time.localeCompare(a[1].time));
                historyList.innerHTML = entries.map(([sentence, data]) => {
                    const shortTime = new Date(data.time).toLocaleString();
                    const userInput = data.userInput || '（无输入）';
                    return `<li>
                        <div><strong>原文：</strong>${escapeHtml(sentence)}</div>
                        <div style="color:#555; margin-top:2px;"><strong>你的输入：</strong>${escapeHtml(userInput)}</div>
                        <small style="color:#888;">${shortTime}</small>
                        <button class="delete-btn" onclick="deleteHistoryItem('${escapeHtml(sentence).replace(/'/g, "\\'")}')">删除</button>
                    </li>`;
                }).join('');
            }
            historyModal.classList.add('active');
        }

        function closeHistory() { historyModal.classList.remove('active'); }

        function deleteHistoryItem(sentence) {
            removeHistory(sentence);
            sentencePool = sentencePool.filter(s => s !== sentence);
            saveSentencePool(sentencePool);
            showHistory();
            showToast('已删除记录', 1500);
        }

        historyModal.addEventListener('click', (e) => { if (e.target === historyModal) closeHistory(); });
        userInputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); checkAnswer(); }
        });
        document.getElementById('newSentenceInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); addNewSentence(); }
        });

        // 初始化
        window.onload = () => {
            const savedSpeed = localStorage.getItem(STORAGE_KEY_SPEED);
            if (savedSpeed) {
                playbackSpeed = parseFloat(savedSpeed);
                if (isNaN(playbackSpeed) || playbackSpeed < 0.6 || playbackSpeed > 1.2) playbackSpeed = 0.85;
            }
            speedSlider.value = playbackSpeed;
            speedValueEl.textContent = playbackSpeed.toFixed(2) + 'x';

            // 初始化日历变量
            const now = new Date();
            calYear = now.getFullYear();
            calMonth = now.getMonth();

            if (!sentencePool.length) {
                showToast('句子库为空，请添加练习句子', 3000);
                updatePlayPauseButton();
                return;
            }
            currentIndex = Math.floor(Math.random() * sentencePool.length);
            clearInputAndResult();
            resetTextareaHeight();
            totalChars = sentencePool[currentIndex].length;
            estimatedDuration = Math.max(1, totalChars / (Math.max(0.5, playbackSpeed) * 14));
            totalTimeDisplay.textContent = formatTime(estimatedDuration);
            updatePlayPauseButton();
            setTimeout(() => userInputEl.focus(), 400);
        };

        window.addEventListener('beforeunload', () => {
            detachUtterance();
            window.speechSynthesis.cancel();
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            if (recordingUrl) URL.revokeObjectURL(recordingUrl);
        });
    </script>
</body>
</html>
